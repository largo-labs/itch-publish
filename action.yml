name: Largo Labs publish
description: Build a web game, check it, load it in headless Chromium, and publish it as game.zip on a GitHub Release that LocalArcade installs.
author: Largo Labs

inputs:
  publish:
    description: "'true' publishes the build as a GitHub Release (game.zip, marked latest). Anything else only builds and tests. Needs 'permissions: contents: write' in the workflow."
    required: false
    default: 'false'
  path:
    description: Game folder holding package.json and GAME.md, relative to the repo root.
    required: false
    default: '.'
  node-version:
    description: Node.js version for the build.
    required: false
    default: '24'
  github-token:
    description: Token that creates the release. Defaults to the workflow's GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  keep-releases:
    description: How many build releases to keep. Older ones are deleted with their tags. '0' keeps all.
    required: false
    default: '5'

outputs:
  version:
    description: The build's version (package.json version + short commit).
    value: ${{ steps.check.outputs.version }}
  release-tag:
    description: The GitHub Release made for this build (v<version>-<short commit>), empty when none was made.
    value: ${{ steps.release.outputs.tag }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.path }}/package-lock.json

    - name: Install
      shell: bash
      working-directory: ${{ inputs.path }}
      run: npm ci

    - name: Typecheck
      shell: bash
      working-directory: ${{ inputs.path }}
      run: npm run typecheck --if-present

    - name: Build
      shell: bash
      working-directory: ${{ inputs.path }}
      run: npm run build

    - name: Check the build
      id: check
      shell: bash
      env:
        GAME_DIR: ${{ inputs.path }}
      run: node "$GITHUB_ACTION_PATH/check.mjs" "$GAME_DIR"

    - name: Smoke test in headless Chromium
      shell: bash
      env:
        DIST: ${{ steps.check.outputs.dist }}
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm install --no-save --no-package-lock --silent playwright@1.64.0
        npx playwright install --with-deps --only-shell chromium
        node smoke.mjs "$DIST" "$RUNNER_TEMP/smoke.png"

    - name: Upload smoke-test screenshot
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: smoke-screenshot
        path: ${{ runner.temp }}/smoke.png
        if-no-files-found: ignore

    - name: Publish game.zip as a GitHub Release
      id: release
      if: inputs.publish == 'true' && github.event_name != 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        DIST: ${{ steps.check.outputs.dist }}
        VERSION: ${{ steps.check.outputs.version }}
        TITLE: ${{ steps.check.outputs.title }}
        KEEP: ${{ inputs.keep-releases }}
      run: bash "$GITHUB_ACTION_PATH/release.sh" "$DIST"
